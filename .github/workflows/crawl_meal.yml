name: Crawl Meal Menu

on:
  schedule:
    - cron: '0 1 * * 1-5'  # UTC 00:43 = KST 09:43
  workflow_dispatch: # GitHub 웹 UI의 Actions 탭에서 버튼 클릭으로 수동 실행 지원

permissions:
  contents: write

jobs:
  crawl:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -NoProfile -Command {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Python to PATH
        run: |
          "C:\Users\AXBIS\AppData\Local\Programs\Python\Python312" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Users\AXBIS\AppData\Local\Programs\Python\Python312\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install -q requests beautifulsoup4 pillow paddleocr paddlepaddle

      - name: Run meal crawler
        run: |
          python croll.py

      - name: Commit and push updated meal data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add meal_output/
          $changes = git status --porcelain meal_output/
          if (-not $changes) {
            Write-Host "No changes in meal_output to commit."
          } else {
            $today = (Get-Date).ToString("yyyy-MM-dd")
            git commit -m "chore(auto): update meal menu data [$today]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
