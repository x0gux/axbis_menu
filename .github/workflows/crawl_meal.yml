name: Crawl Meal Menu

on:
  schedule:
    # 매주 월요일~금요일 한국 시간(KST) 오전 10:00 (UTC 01:00)
    - cron: '0 1 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI의 Actions 탭에서 버튼 클릭으로 수동 실행 지원

permissions:
  contents: write

jobs:
  crawl:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow paddleocr paddlepaddle

      - name: Run meal crawler
        run: |
          python croll.py

      - name: Commit and push updated meal data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add meal_output/
          if git diff --staged --quiet; then
            echo "No changes in meal_output to commit."
          else
            git commit -m "chore(auto): update meal menu data [$(date +'%Y-%m-%d')]"
            git push
          fi
