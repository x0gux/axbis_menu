name: Crawl Meal Menu

on:
  schedule:
    # 매주 월요일~금요일 한국 시간(KST) 오전 10:00 (UTC 01:00)
    - cron: '0 1 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI의 Actions 탭에서 버튼 클릭으로 수동 실행 지원

permissions:
  contents: write

jobs:
  crawl:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install -q requests beautifulsoup4 pillow paddleocr paddlepaddle

      - name: Run meal crawler
        run: |
          python croll.py

      - name: Commit and push updated meal data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add meal_output/
          $changes = git status --porcelain meal_output/
          if (-not $changes) {
            Write-Host "No changes in meal_output to commit."
          } else {
            $today = (Get-Date).ToString("yyyy-MM-dd")
            git commit -m "chore(auto): update meal menu data [$today]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
